<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Text Accent Gradients -->
    <linearGradient id="accentTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowRevenue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.65; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-35px, 25px); }
    }
    @keyframes metricPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.02); opacity: 1; }
    }
    .wave { animation: waveMove 12s ease-in-out infinite; }
    .pulsing-glow { animation: pulseGlow 6s ease-in-out infinite; }
    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 14s ease-in-out infinite; }
    .badge-node { animation: metricPulse 5s ease-in-out infinite; }
  </style>

  <!-- Deep Tech Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGradient)"/>

  <!-- Subtle Perspective Grid Layer in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Ambient Dynamic Floating Orbs (Behind Text) -->
  <g class="orb-1" opacity="0.35" filter="url(#glow)">
    <circle cx="220" cy="80" r="110" fill="#6366f1"/>
  </g>
  <g class="orb-2" opacity="0.25" filter="url(#glow)">
    <circle cx="980" cy="280" r="130" fill="#06b6d4"/>
  </g>

  <!-- Animated Revenue & Lifecycle Trajectory Curves in Background -->
  <g class="wave" opacity="0.38">
    <path d="M -50,300 C 200,280 350,170 550,220 C 750,270 900,140 1250,170" fill="none" stroke="url(#pulseLine)" stroke-width="3" stroke-dasharray="6,6"/>
    <path d="M -50,330 C 250,310 400,200 650,240 C 900,280 1000,100 1250,110" fill="none" stroke="url(#glowRevenue)" stroke-width="2.5" filter="url(#subtleGlow)"/>
  </g>

  <!-- Glowing Dynamic Metric Nodes (Background Lifecycle Signals) -->
  <g class="pulsing-glow">
    <circle cx="550" cy="220" r="5" fill="#38bdf8"/>
    <circle cx="650" cy="240" r="5" fill="#10b981"/>
    <circle cx="900" cy="140" r="6" fill="#c084fc"/>
    <circle cx="1000" cy="100" r="7" fill="#38bdf8" filter="url(#subtleGlow)"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitles (Always Legible & Front) -->
  <g id="foreground-content">
    <!-- Category Badge Top Center -->
    <g transform="translate(600, 52)">
      <rect x="-170" y="-15" width="340" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
        ENTERPRISE REVOPS &amp; BILLING ENGINE
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#accentTitle)" text-anchor="middle" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Revenue Operations &amp; Lifecycle Management
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
      Curated Architecture for Quote-to-Cash, Metered Billing, ASC 606 RevRec &amp; Revenue Intelligence
    </text>

    <!-- Interactive / Status Pills in Foreground -->
    <g transform="translate(600, 245)">
      <!-- Pill 1: ASC 606 & IFRS 15 -->
      <g transform="translate(-360, 0)" class="badge-node">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#131d31" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4.5" fill="#10b981"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">ASC 606 / IFRS 15</text>
      </g>

      <!-- Pill 2: Metering & Invoicing -->
      <g transform="translate(-180, 0)" class="badge-node">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#131d31" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4.5" fill="#38bdf8"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Usage &amp; Metering</text>
      </g>

      <!-- Pill 3: Double-Entry Ledger -->
      <g transform="translate(5, 0)" class="badge-node">
        <rect x="0" y="0" width="175" height="38" rx="8" fill="#131d31" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4.5" fill="#818cf8"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Double-Entry Ledger</text>
      </g>

      <!-- Pill 4: GTM AI Agents -->
      <g transform="translate(195, 0)" class="badge-node">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#131d31" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4.5" fill="#c084fc"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">RevOps AI Agents</text>
      </g>
    </g>

    <!-- Bottom Metadata Tagline -->
    <text x="600" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
      ⚡ Production-Grade SaaS Benchmarks &amp; Verified Self-Hosted Open-Source Frameworks
    </text>
  </g>
</svg>
